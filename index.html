<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV & Excel File Merger</title>
    <!-- Tailwind CSS for modern, responsive UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) library for parsing and writing Excel/CSV files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">파일 병합 마스터</h1>
                    <p class="text-xs text-slate-500">CSV, XLS, XLSX 파일을 순서대로 완벽하게 병합하세요</p>
                </div>
            </div>
            <span class="text-xs bg-indigo-50 text-indigo-700 font-medium px-3 py-1.5 rounded-full border border-indigo-100">브라우저 전용 보안 처리</span>
        </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Panel: File Upload & Settings -->
        <div class="lg:col-span-1 space-y-6">
            <!-- Upload Box Card -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="font-semibold text-slate-900 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    1. 파일 업로드
                </h2>
                
                <div id="drop-zone" class="border-2 border-dashed border-slate-300 hover:border-indigo-500 rounded-xl p-6 text-center cursor-pointer transition bg-slate-50 hover:bg-indigo-50/30 group">
                    <input type="file" id="file-input" multiple accept=".csv, .xlsx, .xls" class="hidden">
                    <div class="flex flex-col items-center pointer-events-none">
                        <div class="p-3 bg-white rounded-full shadow-sm group-hover:scale-110 transition duration-200 text-indigo-600 mb-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                        <p class="text-sm font-medium text-slate-700">파일을 드래그하거나 <span class="text-indigo-600 underline">클릭해서 선택</span></p>
                        <p class="text-xs text-slate-400 mt-1">지원 형식: CSV, XLSX, XLS (다중 선택 가능)</p>
                    </div>
                </div>

                <div class="pt-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1 uppercase tracking-wider">병합 옵션</label>
                    <div class="space-y-2 text-sm">
                        <label class="flex items-center space-x-2 text-slate-700 cursor-pointer">
                            <input type="checkbox" id="header-check" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                            <span>첫 번째 행을 헤더(제목 행)로 고정</span>
                        </label>
                        <label class="flex items-center space-x-2 text-slate-700 cursor-pointer">
                            <input type="checkbox" id="source-col-check" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                            <span>원본 파일 이름 열(Column) 추가하기</span>
                        </label>
                    </div>
                </div>

                <button id="merge-btn" onclick="processFiles()" disabled class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-400 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition duration-150 flex items-center justify-center space-x-2 cursor-pointer disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                    </svg>
                    <span>2. 순서대로 파일 병합하기</span>
                </button>
            </div>

            <!-- Download Result Card -->
            <div id="download-card" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4 hidden">
                <h2 class="font-semibold text-slate-900 flex items-center gap-2 text-emerald-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    3. 병합 완료 및 다운로드
                </h2>
                <p id="merge-summary" class="text-xs text-slate-600 bg-slate-50 p-3 rounded-lg border border-slate-100"></p>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="downloadFile('xlsx')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-3 rounded-xl text-sm transition shadow-sm flex items-center justify-center gap-1.5 cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        XLSX 다운로드
                    </button>
                    <button onclick="downloadFile('csv')" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-3 rounded-xl text-sm transition shadow-sm flex items-center justify-center gap-1.5 cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        CSV 다운로드
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Panel: File Queue & Data Preview -->
        <div class="lg:col-span-2 space-y-6">
            <!-- File Queue Card -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="font-semibold text-slate-900 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                        </svg>
                        업로드된 파일 순서 (드래그하여 순서 변경)
                    </h2>
                    <span id="file-count" class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">0개 파일</span>
                </div>

                <div id="file-list-container" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <div id="empty-queue" class="text-center py-8 text-slate-400 text-sm border border-dashed border-slate-200 rounded-xl">
                        등록된 파일이 없습니다. 왼쪽에서 파일을 업로드해주세요.
                    </div>
                </div>
            </div>

            <!-- Preview Card -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="font-semibold text-slate-900 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        병합 결과 미리보기 (상위 50행)
                    </h2>
                    <span id="preview-meta" class="text-xs text-slate-500"></span>
                </div>

                <div class="border border-slate-200 rounded-xl overflow-hidden bg-slate-50">
                    <div id="table-wrapper" class="overflow-x-auto max-h-96">
                        <table id="preview-table" class="w-full text-left border-collapse text-xs">
                            <thead id="preview-head" class="bg-slate-100 text-slate-700 sticky top-0">
                                <tr><th class="p-3 text-center text-slate-400">병합을 실행하면 미리보기가 표시됩니다.</th></tr>
                            </thead>
                            <tbody id="preview-body" class="divide-y divide-slate-200 bg-white">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Custom Notification/Message Modal -->
    <div id="message-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl border border-slate-100 space-y-4">
            <h3 id="modal-title" class="font-bold text-slate-900 text-lg">알림</h3>
            <p id="modal-text" class="text-sm text-slate-600"></p>
            <button onclick="closeModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-sm cursor-pointer">확인</button>
        </div>
    </div>

    <script>
        let uploadedFiles = []; // Array to store File objects in order
        let mergedWorkbookData = null; // Stores parsed final data rows
        let finalWorkbookHeader = [];
        let draggedIndex = null;

        // Custom modal helper (replaces alert)
        function showMessage(title, text) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            document.getElementById('message-modal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('message-modal').classList.add('hidden');
        }

        // File drop zone event wiring
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-indigo-500', 'bg-indigo-50/50'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/50'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/50');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFiles(e.target.files);
            }
            fileInput.value = ''; // Reset input to allow re-uploading same files if needed
        });

        function handleFiles(files) {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const ext = file.name.split('.').pop().toLowerCase();
                if (['csv', 'xlsx', 'xls'].includes(ext)) {
                    uploadedFiles.push(file);
                } else {
                    showMessage('지원하지 않는 형식', `"${file.name}" 파일은 지원하지 않는 형식입니다. (CSV, XLSX, XLS만 가능)`);
                }
            }
            renderFileList();
        }

        function renderFileList() {
            const container = document.getElementById('file-list-container');
            const countBadge = document.getElementById('file-count');
            const mergeBtn = document.getElementById('merge-btn');

            countBadge.innerText = `${uploadedFiles.length}개 파일`;
            mergeBtn.disabled = uploadedFiles.length === 0;

            if (uploadedFiles.length === 0) {
                container.innerHTML = `<div id="empty-queue" class="text-center py-8 text-slate-400 text-sm border border-dashed border-slate-200 rounded-xl">등록된 파일이 없습니다. 왼쪽에서 파일을 업로드해주세요.</div>`;
                return;
            }

            container.innerHTML = '';
            uploadedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl transition cursor-grab active:cursor-grabbing';
                item.draggable = true;
                item.dataset.index = index;

                // Drag and drop sorting events
                item.addEventListener('dragstart', (e) => {
                    draggedIndex = index;
                    e.dataTransfer.effectAllowed = 'move';
                });
                item.addEventListener('dragover', (e) => { e.preventDefault(); });
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedIndex !== null && draggedIndex !== index) {
                        const movedItem = uploadedFiles.splice(draggedIndex, 1)[0];
                        uploadedFiles.splice(index, 0, movedItem);
                        draggedIndex = null;
                        renderFileList();
                    }
                });

                item.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <span class="flex-shrink-0 w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold flex items-center justify-center">${index + 1}</span>
                        <div class="truncate">
                            <p class="text-sm font-medium text-slate-800 truncate">${file.name}</p>
                            <p class="text-xs text-slate-400">${(file.size / 1024).toFixed(1)} KB</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 flex-shrink-0">
                        <button onclick="moveFile(${index}, -1)" ${index === 0 ? 'disabled' : ''} class="p-1.5 hover:bg-slate-200 rounded-lg text-slate-500 disabled:opacity-30 cursor-pointer disabled:cursor-not-allowed" title="위로">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
                        </button>
                        <button onclick="moveFile(${index}, 1)" ${index === uploadedFiles.length - 1 ? 'disabled' : ''} class="p-1.5 hover:bg-slate-200 rounded-lg text-slate-500 disabled:opacity-30 cursor-pointer disabled:cursor-not-allowed" title="아래로">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <button onclick="removeFile(${index})" class="p-1.5 hover:bg-rose-100 rounded-lg text-rose-500 cursor-pointer ml-1" title="삭제">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function moveFile(index, direction) {
            const targetIndex = index + direction;
            if (targetIndex >= 0 && targetIndex < uploadedFiles.length) {
                const temp = uploadedFiles[index];
                uploadedFiles[index] = uploadedFiles[targetIndex];
                uploadedFiles[targetIndex] = temp;
                renderFileList();
            }
        }

        function removeFile(index) {
            uploadedFiles.splice(index, 1);
            renderFileList();
        }

        async function processFiles() {
            if (uploadedFiles.length === 0) return;

            const useHeader = document.getElementById('header-check').checked;
            const addSourceCol = document.getElementById('source-col-check').checked;

            try {
                let allRows = [];
                let unifiedHeader = null;
                let totalRowsCount = 0;

                for (let i = 0; i < uploadedFiles.length; i++) {
                    const file = uploadedFiles[i];
                    const data = await readFileAsArrayBuffer(file);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // Take the first sheet of each file workbook
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // Convert sheet to JSON array of arrays
                    const sheetRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    
                    if (sheetRows.length === 0) continue;

                    let fileHeader = [];
                    let fileDataRows = [];

                    if (useHeader) {
                        fileHeader = sheetRows[0];
                        fileDataRows = sheetRows.slice(1);
                    } else {
                        fileHeader = sheetRows[0].map((_, idx) => `Column ${idx + 1}`);
                        fileDataRows = sheetRows;
                    }

                    // Establish unified header from the first valid file
                    if (!unifiedHeader) {
                        unifiedHeader = [...fileHeader];
                        if (addSourceCol) {
                            unifiedHeader.push('원본 파일명');
                        }
                    }

                    // Map rows to match the unified header structure or append source column
                    for (let r = 0; r < fileDataRows.length; r++) {
                        let row = [...fileDataRows[r]];
                        // Pad or truncate row length to match header length if needed
                        while (row.length < fileHeader.length) {
                            row.push('');
                        }
                        
                        if (addSourceCol) {
                            row.push(file.name);
                        }

                        allRows.push(row);
                        totalRowsCount++;
                    }
                }

                if (allRows.length === 0) {
                    showMessage('알림', '병합할 데이터가 존재하지 않습니다.');
                    return;
                }

                finalWorkbookHeader = unifiedHeader;
                mergedWorkbookData = [unifiedHeader, ...allRows];

                // Render preview table
                renderPreview(unifiedHeader, allRows);

                // Show completion info
                document.getElementById('download-card').classList.remove('hidden');
                document.getElementById('merge-summary').innerHTML = `총 <b>${uploadedFiles.length}개</b> 파일 병합 완료<br>총 데이터 행 수: <b>${totalRowsCount}개</b> (헤더 제외)`;
                
                // Scroll smoothly to download section
                document.getElementById('download-card').scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                console.error(err);
                showMessage('오류 발생', '파일을 병합하는 동안 문제가 발생했습니다. 파일 형식을 확인해주세요.');
            }
        }

        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsArrayBuffer(file);
            });
        }

        function renderPreview(header, rows) {
            const headElem = document.getElementById('preview-head');
            const bodyElem = document.getElementById('preview-body');
            const metaElem = document.getElementById('preview-meta');

            metaElem.innerText = `전체 ${rows.length}행 중 상위 ${Math.min(rows.length, 50)}행 표시`;

            // Render Header
            let headHtml = '<tr>';
            headHtml += '<th class="p-2.5 font-semibold text-slate-500 border-b border-slate-200 w-12 text-center">#</th>';
            header.forEach(h => {
                headHtml += `<th class="p-2.5 font-semibold text-slate-700 border-b border-slate-200 whitespace-nowrap">${escapeHtml(String(h))}</th>`;
            });
            headHtml += '</tr>';
            headElem.innerHTML = headHtml;

            // Render Body (up to 50 rows)
            let bodyHtml = '';
            const previewRows = rows.slice(0, 50);
            previewRows.forEach((row, idx) => {
                bodyHtml += `<tr class="hover:bg-slate-50 transition">`;
                bodyHtml += `<td class="p-2.5 text-slate-400 text-center border-b border-slate-100">${idx + 1}</td>`;
                header.forEach((_, colIdx) => {
                    const val = row[colIdx] !== undefined ? row[colIdx] : '';
                    bodyHtml += `<td class="p-2.5 text-slate-700 border-b border-slate-100 whitespace-nowrap max-w-xs truncate" title="${escapeHtml(String(val))}">${escapeHtml(String(val))}</td>`;
                });
                bodyHtml += `</tr>`;
            });
            bodyElem.innerHTML = bodyHtml;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function downloadFile(format) {
            if (!mergedWorkbookData) {
                showMessage('알림', '먼저 파일을 병합해주세요.');
                return;
            }

            const ws = XLSX.utils.aoa_to_sheet(mergedWorkbookData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "MergedData");

            const timestamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const filename = `merged_output_${timestamp}`;

            if (format === 'xlsx') {
                XLSX.writeFile(wb, `${filename}.xlsx`);
            } else if (format === 'csv') {
                XLSX.writeFile(wb, `${filename}.csv`, { bookType: 'csv' });
            }
        }
    </script>
</body>
</html>
